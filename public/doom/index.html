<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- No outside connections at all: the engine's multiplayer websockets can't reach anything. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <title>DOOM</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        outline: none;
      }
      #status {
        position: fixed;
        left: 1rem;
        top: 1rem;
        color: #f386a1;
        font:
          14px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <p id="status">loading DOOM…</p>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <script>
      // Chocolate Doom (cloudflare/doom-wasm, GPL-2.0) running the DOOM 1.9 shareware WAD.
      var statusEl = document.getElementById('status');
      var canvas = document.getElementById('canvas');
      var Module = {
        noInitialRun: true,
        canvas: canvas,
        preRun: function () {
          Module.FS.createPreloadedFile('', 'doom1.wad', 'doom1.wad', true, true);
          Module.FS.createPreloadedFile('', 'default.cfg', 'default.cfg', true, true);
        },
        onRuntimeInitialized: function () {
          statusEl.remove();
          canvas.focus();
          callMain(['-iwad', 'doom1.wad', '-window', '-nogui', '-nomusic', '-config', 'default.cfg']);
        },
        // Quitting from the game menu: tell the launcher to close its window.
        // Emscripten calls quit on every exit path; rethrow so the engine stops.
        quit: function (status, toThrow) {
          parent.postMessage({ type: 'doom:quit' }, location.origin);
          throw toThrow;
        },
        print: function () {},
        printErr: function () {},
        setStatus: function () {},
      };
      addEventListener('click', function () {
        canvas.focus();
      });
    </script>
    <script src="websockets-doom.js"></script>
  </body>
</html>
