name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *' # hourly: redeploy with fresh GitHub data
    - cron: '0 5 * * 1' # Mondays: also commit the GitHub snapshot to main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Interaction smoke test
        run: npm run smoke
        env:
          PW_CHANNEL: chromium

  # Deploys main to Cloudflare once the build, tests and smoke test pass, and
  # every hour, so the GitHub data on the site (repos, READMEs, last pushes) is
  # never more than an hour old. Each deploy fetches that data itself rather than
  # committing it, so main doesn't get a bot commit every hour.
  deploy:
    needs: build
    if: >-
      always() && !failure() && !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://maintz.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The script writes the file only once everything is fetched, so a GitHub
      # outage leaves the committed snapshot in place and the deploy goes ahead.
      - name: Fetch fresh GitHub data
        run: node scripts/sync-github.mjs || echo "::warning::GitHub sync failed; deploying the committed snapshot"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_PROVIDERS: ${{ vars.PUBLIC_SUPABASE_PROVIDERS }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Uploads each PR as a Worker version that isn't deployed, at its own preview
  # URL, and comments the link on the PR. Fork PRs get no secrets, so they're skipped.
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_PROVIDERS: ${{ vars.PUBLIC_SUPABASE_PROVIDERS }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - name: Upload the preview version
        id: upload
        run: |
          npx wrangler versions upload --preview-alias "pr-$PR" | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-cmaintz-site\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview link
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview of ${HEAD_SHA::7}: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.upload.outputs.url }}

  # Weekly: commit src/data/github.json to main, so local builds and PR previews
  # don't drift far from the live data. (Deploys fetch their own copy.)
  refresh-github-data:
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with the new snapshot
        run: npm ci && npm run build
      - name: Commit the snapshot to main
        run: |
          git diff --quiet -- src/data/github.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): refresh GitHub snapshot' -- src/data/github.json
          git push origin HEAD:main
