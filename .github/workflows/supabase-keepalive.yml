name: supabase-keepalive

# Free-tier Supabase projects pause after 7 days without activity, which would
# silently break comments. One tiny read every 3 days keeps the project awake.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one comment id
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "PUBLIC_SUPABASE_URL not set; skipping"; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/site_comments?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" > /dev/null
          echo "pinged"
