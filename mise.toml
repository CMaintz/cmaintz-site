# Foundry verb interface — TypeScript / Node template.
# Copy to a repo's mise.toml and adjust the tool versions. See CONTRACT.md.

[tools]
node = "22.23.4"
gitleaks = "8.30.1"  # pre-push secret scan (.githooks/pre-push)
# deno = "2.9.7"  # uncomment if the repo has Deno code (see FOUNDRY_DENO_PATHS below)

[env]
# habit-hooks (structural-smell detector) is a pinned, mise-managed dependency, so the
# SAME version runs in-loop (Stop hook), pre-push (`gate`) and in CI. It's a pip tool,
# not a clean [tools] entry, so it's provisioned into a per-plugin venv by setup:habit-hooks
# (postinstall) whose bin goes on PATH below - mirroring how java.toml pins PMD. The core
# and its language plugin ship in lockstep, so both pin to this one version. Renovate bumps
# it (presets/renovate.json has the mise.toml customManager); keep it == the reusable
# workflow's `habit_hooks_version` default (1.5.0).
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-typescript"
# The Foundry scripts (foundry-verb-wrap, foundry-flaky, npm-audit-ratchet.mjs,
# foundry-explain and its rule catalog) are provisioned by
# setup:foundry-scripts into a cache dir at this ref, not vendored into the repo (see that
# task for why). Renovate tracks the pin via the comment above it.
# A bump must also update the sha256 lines in setup:foundry-scripts.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.14.0"

# Put local binaries on PATH so tasks call `eslint`, not `npx eslint`; the habit-hooks venv
# bin (Linux `bin/`, Windows `Scripts/` - a missing one on PATH is harmless); the Foundry
# gate scripts cached by setup:foundry-scripts (so the gate runs `foundry-verb-wrap` by
# name); and the repo's own scripts/ last.
_.path = [
    "./node_modules/.bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]

# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Gitignore `.foundry/`. Read it with `foundry-loop-report`. The gate calls
# `foundry-verb-wrap` (cached by setup:foundry-scripts, on PATH above).
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# Deno code to type-check with `deno check` in `typecheck` (space-separated dirs/files,
# relative to this file), e.g. Supabase Edge Functions incl. their _shared/ modules.
# FOUNDRY_DENO_PATHS = "supabase/functions"

# ── FOUNDRY_SINCE — changed-scope for the fast placements ────────────────────
# A git ref (empty ⇒ origin/main). When SET, the file-local verbs (`lint`, `test`)
# restrict work to files changed since its merge-base with HEAD — for the in-loop
# Stop hook and pre-push, where speed matters. When UNSET (CI, and the final
# `/ship` gate), they run whole-tree. Whole-program checks (`typecheck`) ignore it
# and always run whole-tree — a changed file can break an unchanged one. This is
# execute-scope, safe only because whole-tree CI is the authoritative backstop.
# See designs/changed-scope-gate.md. An unresolvable ref falls back to whole-tree
# (never skips). The signal is opt-in per verb; callers MUST NOT require it.

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)

[hooks]
# Provision the pinned tools on `mise install` (local and CI alike). Array form runs them
# in order; each no-ops on a warm install.
postinstall = ["mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

# Fetch the pinned Foundry scripts into a cache dir instead of copying them into the repo
# (agent/CI plumbing, not the repo's code; a copy drifts and needs a re-sync on every bump).
# Every run checks each script against its sha256 below, cached or not: the tag is only a
# locator, so a moved tag, a proxy page or a truncated download is re-fetched once and then
# refused, never cached. A verified cache needs no network, so the gate hot path stays
# offline; a ref bump needs the network once. cut-release.sh writes the digests for the tag
# it cuts, so bumping FOUNDRY_SCRIPTS_REF means taking that tag's digest lines with it.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry scripts into a cache dir, sha256-verified"
run = '''
set -eu
# <file> <sha256 of that file at FOUNDRY_SCRIPTS_REF>, one per line. A bare name is
# scripts/<name>; a path (the rule catalog) is fetched from there, cached by basename.
# foundry-smells joins this list at the next FOUNDRY_SCRIPTS_REF bump (once a tag ships
# it); until then the `smells` task falls back to habit-hooks directly. Do NOT add a
# comment inside the quoted block below - `read -r s want` would try to fetch it.
scripts='
foundry-verb-wrap bec5e917c13c22ed534ea0a3a49e33b099be35f05d8fc39473b0bd960fc4bf0e
foundry-flaky 7636b33a80f8d73857f10dc909592681dd2d0f16fa798fb3f6cf4f12868af424
npm-audit-ratchet.mjs 169376a3227c5806f7438ef8641d2b5d5460d78a704c87e639fb176350f09cdb
foundry-explain 6b483daf5867badb4db5d222fccbe717b310deda6ebd064e8f478ec3f2dcef60
presets/rules/catalog.toml c311172c29dd735821e2a0efe566aecc35320f45d375bfac1a2622a43ba4fb9b
presets/rules/matchers.toml 8f0a748fc181e1a37c754d79e7a196e4d9006592e633826c8031b89acba7f455
'
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF"
# sha256sum ships with Linux and Git Bash; macOS has only shasum.
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
mkdir -p "$dst"
while read -r s want; do
  [ -n "$s" ] || continue
  case "$s" in */*) src="$s" ;; *) src="scripts/$s" ;; esac
  f="${s##*/}"
  [ -f "$dst/$f" ] && [ "$(digest "$dst/$f")" = "$want" ] && continue
  # A per-run temp file, moved into place only once verified: concurrent runs (parallel
  # worktrees share $HOME) never write into each other's download or expose a partial one.
  tmp=$(mktemp "$dst/.$f.XXXXXX")
  if ! curl -fsSL "$base/$src" -o "$tmp"; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    exit 1
  fi
  got=$(digest "$tmp")
  if [ "$got" != "$want" ]; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: $s at $FOUNDRY_SCRIPTS_REF has sha256 $got, expected $want; refusing it." >&2
    echo "  If FOUNDRY_SCRIPTS_REF was just bumped, copy the digest lines from that ref's mise template;" >&2
    echo "  otherwise the download was not the script (proxy or captive page, truncation, moved tag)." >&2
    exit 1
  fi
  chmod +x "$tmp" 2>/dev/null || true
  mv -f "$tmp" "$dst/$f"
done <<EOF
$scripts
EOF
'''

[tasks.fix]
description = "Auto-fix what is mechanically fixable; never opinionated"
# Prettier formats; ESLint fixes what it can (stale suppressions would make --fix bail,
# hence the pass flag), then the prune pass drops suppressions whose
# violation is gone, so eslint-suppressions.json only ever shrinks.
run = [
    "prettier --write .",
    "eslint . --fix --pass-on-unpruned-suppressions",
    "eslint . --prune-suppressions",
]

# Provision the pinned habit-hooks (core + language plugin, same version) into a
# per-plugin venv. Auxiliary (tier c), like setup:pmd - not a contract verb, not in
# `gate` directly; it runs via the postinstall hook on `mise install`. Per-plugin dir
# so a multi-stack machine never reuses the ts venv for a java repo (wrong plugin).
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + language plugin into a venv (smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells, folded into `lint` below (tier b - verb composition, like novar).
# This is the same check CI's habits job runs; running it in `lint` makes `gate` the
# same oracle locally as in CI. It calls the pinned venv binary by its full path (not
# `habit-hooks` from PATH): mise APPENDS _.path, so an unpinned global install would
# otherwise shadow the pin - calling the venv directly is what makes the version pin real.
# --branch scopes to files changed vs the ratchet base (FOUNDRY_BASE_REF, default
# origin/main; CI sets the PR base SHA) - unchanged files are already covered by the snooze
# baseline. Degrades gracefully: skip when there's no .habit-hooks config or snooze
# baseline, or the base can't be resolved. It only FAILS hard when a config + baseline
# exist but the pinned habit-hooks is missing - a broken setup (run `mise install`), and
# CONTRACT says divergence is a bug, not a thing to skip.
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

[tasks.lint]
description = "Prettier, ESLint, code-size rules and structural smells; non-mutating"
# ESLint (line length and the recommended sets) fails on new violations and on stale
# suppressions; eslint-suppressions.json is the accepted debt and may only shrink.
# prettier --check fails on unformatted files, so drift can't reach main and leak into
# unrelated branches through `mise run fix`.
# Honours FOUNDRY_SINCE like the template: changed files at the fast placements,
# whole-tree in CI. prettier gets every changed file (--ignore-unknown skips what it
# can't format), eslint only the JS/TS/Astro ones. Then the function/file size rules
# (scripts/check-code-size.mjs) and the habit-hooks smell check.
run = ['''
set -eu
whole() { eslint .; prettier --check .; }
if [ -z "${FOUNDRY_SINCE+x}" ]; then whole; exit 0; fi
base="${FOUNDRY_SINCE:-origin/main}"
mb=$(git merge-base "$base" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "changed-scope lint: cannot resolve '$base'; whole-tree"; whole; exit 0; fi
changed=$(git diff --name-only --diff-filter=ACMR "$mb" 2>/dev/null || true)
untracked=$(git ls-files --others --exclude-standard 2>/dev/null || true)
files=$(printf '%s\n%s\n' "$changed" "$untracked" | sort -u | sed '/^$/d')
if [ -z "$files" ]; then echo "changed-scope lint: nothing changed since $mb"; exit 0; fi
js=$(printf '%s\n' "$files" | grep -E '\.(ts|tsx|js|cjs|mjs|astro)$' || true)
if [ -n "$js" ]; then printf '%s\n' "$js" | xargs -d '\n' eslint; fi
printf '%s\n' "$files" | xargs -d '\n' prettier --check --ignore-unknown
''', "node scripts/check-code-size.mjs", "mise run smells"]

[tasks.typecheck]
description = "Static types (astro check over tsconfig.json)"
# astro check covers .astro files and the plain .ts the tsconfig includes. Keep the
# tsconfig guard: without one, framework checkers exit 0 having checked only their own
# file types. No Deno code here (supabase/ holds only migrations).
run = """
set -eu
if [ ! -f tsconfig.json ]; then
  echo "typecheck: no tsconfig.json in $(pwd), so no TypeScript would be checked." >&2
  exit 1
fi
astro check
"""

[tasks.test]
description = "Unit tests with coverage, plus the comments SQL/RLS tests"
# FOUNDRY_SINCE unset (CI / final gate): full suite, coverage and the SQL tests - the oracle.
# FOUNDRY_SINCE set (in-loop / pre-push): only tests affected by the changeset, via
# vitest's module graph. Unresolvable ref => full suite.
run = """
set -eu
if [ -z "${FOUNDRY_SINCE+x}" ]; then vitest run --coverage; exec node scripts/test-comments-sql.mjs; fi
base="${FOUNDRY_SINCE:-origin/main}"
mb=$(git merge-base "$base" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "changed-scope test: cannot resolve '$base'; full suite"; vitest run --coverage; exec node scripts/test-comments-sql.mjs; fi
exec vitest run --changed "$mb"
"""

[tasks.audit]
description = "Dependency vulnerabilities. Local subset; CI security.yml adds gitleaks + SAST"
# Ratcheted npm audit: fails on any critical NOT in .audit-allowlist.json, and on stale
# allowlist entries — so accepted CVE debt can only shrink, exactly like eslint
# suppressions or the habit-hooks snooze baseline. npm audit has no native per-advisory
# ignore, so this is how you accept ONE genuinely-unfixable critical with justification
# without silencing the whole check. With no allowlist file it behaves like plain
# `npm audit --audit-level=critical` (fails on any critical). Prefer fixing (npm audit
# fix, or a targeted `overrides` entry) over accepting. The ratchet script is cached by
# setup:foundry-scripts; address it through $HOME in plain shell, NOT a mise `{{...}}`
# template, because on Windows a templated path carries backslashes bash would strip.
# The pipe hands the script npm's JSON so `npm` resolves in the shell.
run = 'npm audit --json | node "$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF/npm-audit-ratchet.mjs" --level=critical --allowlist=.audit-allowlist.json'

# Architecture fitness (opt-in, tier-c auxiliary until you adopt it). Enforces YOUR
# layer map + no cycles via dependency-cruiser (needs `dependency-cruiser` installed).
# Whole-graph, so NOT changed-scoped — a cycle can be formed by an unrelated edge.
# To adopt: fill the layer map in .dependency-cruiser.cjs (from presets/arch/), generate
# the shrink-only baseline once, then fold `mise run arch` into `lint`. See
# designs/arch-fitness.md. Architecture-agnostic — hexagonal is just the default map.
[tasks.arch]
description = "Architecture fitness: no cross-layer imports, no cycles (dependency-cruiser)"
run = '''
set -eu
cfg=".dependency-cruiser.cjs"
base=".dependency-cruiser-known-violations.json"
if [ ! -f "$cfg" ]; then echo "arch: no $cfg yet — copy presets/arch/ and fill your layer map"; exit 0; fi
if [ -f "$base" ]; then
  exec depcruise src --config "$cfg" --ignore-known "$base"
fi
exec depcruise src --config "$cfg"
'''

# Flaky-test triage (opt-in, tier-c auxiliary). Runs tests emitting a machine report,
# then lets `foundry-flaky` drop QUARANTINED flakes (flaky-baseline.json) from the gate
# decision while still printing them — a real failure still fails. Fold into `test` when
# adopted; keep coverage on the main `test`. See designs/flake-triager.md. `foundry-flaky`
# is on PATH via the setup:foundry-scripts cache dir.
[tasks."test:flaky"]
description = "Tests, with quarantined flakes reported but not gating (flaky-baseline.json)"
run = '''
set -eu
mkdir -p .foundry
rep=".foundry/vitest-report.json"
vitest run --reporter=json --outputFile="$rep" || true
foundry-flaky gate "$rep" flaky-baseline.json
'''

[tasks.gate]
description = "The authoritative composite — the oracle. Nothing merges without this green."
# The one setup:foundry-scripts dep provisions the cached gate scripts first (idempotent,
# ordered-first, like smells' setup:habit-hooks dep) - a safety net for a ref bump not yet
# followed by `mise install`. Do NOT add the VERBS as `depends`: mise runs dependencies in
# parallel with no ordering guarantee, which makes gate output unreadable and hides which
# check failed first. The verbs stay in the sequential array below.
depends = ["setup:foundry-scripts"]
# Each verb is wrapped by `foundry-verb-wrap`, which times it, appends one JSONL line
# to FOUNDRY_TELEMETRY, then propagates the verb's exit code unchanged — telemetry
# never changes the outcome, and a failing verb still stops the sequence. Read the log
# with `foundry-loop-report`. The wrapper is required (cached by setup:foundry-scripts, on
# PATH - see [env]); it is NOT on the six-verb contract.
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
